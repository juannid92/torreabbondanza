name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Senza --frozen-lockfile: bun.lock viene rigenerato dopo l'aggiunta
      # dei pacchetti dei font. Si potra' ripristinare il flag una volta che
      # il lockfile aggiornato sara' stato committato.
      - name: Installa le dipendenze
        run: bun install

         - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build
        run: bun run build
